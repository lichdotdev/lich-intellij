name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: Core logic
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core:test

  plugin:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      # verifyPlugin downloads and extracts IntelliJ IDEA twice, more than the runner's free disk holds; these
      # preinstalled SDKs are never used here and free about 25 GB.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test buildPlugin verifyPlugin
      - uses: actions/upload-artifact@v4
        with:
          name: lich-intellij
          path: build/distributions/*.zip
